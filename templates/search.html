<!DOCTYPE html>
<html>
<head>
    <title>Search Users</title>
</head>
<body>

<h2>Search Results for "{{ query }}"</h2>

<a href="{{ url_for('home') }}">Back Home</a>
<hr>

{% if users %}
    {% for user in users %}
        <div>
            <strong>{{ user.username }}</strong>
            {% if user.profile_picture %}
                <br>
                <img src="{{ url_for('static', filename='uploads/' + user.profile_picture) }}"
                     width="80">
            {% endif %}
        </div>
        <hr>
    {% endfor %}
{% else %}
    <p>No users found.</p>
{% endif %}

</body>
</html>
