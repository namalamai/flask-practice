<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .notification {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .notification.unread {
            border-left: 5px solid #2196f3;
        }

        .notification.read {
            opacity: 0.75;
        }

        .message {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .status {
            font-size: 13px;
            color: #666;
        }

        .home-btn {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: #2196f3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔔 Notifications</h1>

    <a class="home-btn" href="{{ url_for('home') }}">← Back to Home</a>

    {% if notifications %}

        {% for notification in notifications %}

            <div class="notification {% if notification.is_read %}read{% else %}unread{% endif %}">

                <p class="message">
                    {{ notification.message }}
                </p>

                <div class="status">
                    {% if notification.is_read %}
                        ✓ Read
                    {% else %}
                        🟢 New
                    {% endif %}
                </div>

            </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            <p>🔕 No notifications yet.</p>
        </div>

    {% endif %}

</div>

</body>
</html>
